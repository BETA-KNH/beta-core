name: CI

on:
  push:
    branches:
      - main
      - 'claude/**'
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: pre-commit/action@v3.0.1

  build-and-test:
    name: Build & Test (${{ matrix.ros_distribution }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ros_distribution: [jazzy]
    steps:
      - uses: actions/checkout@v6

      - name: Setup ROS2
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.ros_distribution }}

      - name: Expose ROS Python packages to test runner
        run: |
          echo "PYTHONPATH=/opt/ros/${{ matrix.ros_distribution }}/lib/python3.12/site-packages:${PYTHONPATH}" >> "$GITHUB_ENV"

      - name: Check for ROS2 packages
        id: packages
        run: |
          if find . -name 'package.xml' -not -path '*/\.*' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No package.xml files found — skipping build and test."
          fi

      - name: Build and test
        if: steps.packages.outputs.found == 'true'
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          target-ros2-distro: ${{ matrix.ros_distribution }}
          extra-cmake-args: -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.ros_distribution }}
          path: ros_ws/build/*/test_results/**/*.xml
          if-no-files-found: ignore
